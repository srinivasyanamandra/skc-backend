spring:
  application:
    name: sri-karthikeya-caterers-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/skc
    username: postgres
    password: pankaj
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    # Run schema.sql AFTER Hibernate creates/updates entity-driven columns
    # so the migration block can backfill nulls + add NOT NULL constraints
    # on JSONB / TEXT[] columns Hibernate added without defaults.
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  # Auto-apply schema.sql on every boot. The script is rerun-safe (idempotent
  # ALTERs / DROPs guarded by IF EXISTS / IF NOT EXISTS), so it's cheap to
  # re-run and catches any drift between the entity model and the DB.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
      separator: "--;;"
  
  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:info@srikarthikeyacaterers.in}
    password: ${MAIL_PASSWORD:Srinu19#2004}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: ${MAIL_HOST:smtp.hostinger.com}
          starttls:
            enable: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 200
      thread-name-prefix: async-email-

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

# Multipart limits for Document Studio asset uploads (logos, signatures, QR
# codes). Default 1MB is too tight for retina logos; cap at 5MB so admins
# can't accidentally upload a raw camera photo.
spring.servlet.multipart:
  enabled: true
  max-file-size: 5MB
  max-request-size: 6MB

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

# Application-specific configuration
admin:
  emails:
    - info@srikarthikeyacaterers.in
    - srinivas.yanamandra04@gmail.com
  passwords:
    - ${ADMIN_PASSWORD:Srinu19#}
    - ${ADMIN_PASSWORD_2:Srinu19#}

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-bytes-long-for-hs256}
  expiration: 86400000  # 24 hours in milliseconds

review:
  link:
    default-expires-days: 14
    base-url: ${REVIEW_BASE_URL:http://localhost:3000}

campaign:
  throttle:
    per-minute: 120
  default-batch-size: 50
  scheduler:
    poll-interval-ms: 30000   # how often the scheduler scans for queued campaigns

# Document Studio asset storage. Files land on local disk under this dir
# and are served back via a static handler at /uploads/**. On Render free
# tier this dir is ephemeral; swap for S3/R2 before going to production.
studio:
  assets:
    dir: ${STUDIO_ASSETS_DIR:./uploads}
    public-base: /uploads

mail:
  from: ${MAIL_FROM:info@srikarthikeyacaterers.in}
  from-name: ${MAIL_FROM_NAME:Sri Karthikeya Caterers}
  retry:
    max-attempts: 2
    backoff-ms: 1000
  # Set to true to disable actual email sending (for testing)
  disabled: ${MAIL_DISABLED:false}

logging:
  level:
    root: INFO
    syncqubits.ai.skc: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Debug endpoints (enabled in local)
debug:
  endpoints:
    enabled: true
