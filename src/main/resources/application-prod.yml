spring:
  application:
    name: Sri Karthikeya Caterers API
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sri_karthikeya_caterers}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: update
    # Defer schema.sql until after Hibernate has reconciled entity-driven
    # DDL — this lets schema.sql do post-migration cleanup (backfill nulls,
    # promote columns to NOT NULL, drop legacy child tables) on top of the
    # columns Hibernate just added.
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Auto-apply schema.sql at startup. The script is fully idempotent
  # (CREATE/ALTER/DROP guarded by IF [NOT] EXISTS, UPDATE guarded by row
  # existence). On the first boot of a new deploy this performs the
  # consolidation migration; subsequent boots are effectively no-ops.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
      separator: "--;;"
  
  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false
  
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 200
      thread-name-prefix: async-email-

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  forward-headers-strategy: framework
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    connection-timeout: 20000
    max-connections: 8192
    accept-count: 100

logging:
  level:
    root: INFO
    syncqubits.ai.skc: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: /app/logs/application.log
    max-size: 10MB
    max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# ─────────────────────────────────────────────────────────────────
# Application properties bound by AppProperties (prefix = "")
# Important: AppProperties uses an EMPTY prefix and LIST-shaped admin
# fields. The previous `app.admin.email` / `app.jwt.secret` shape
# silently failed to bind, which is why login returned
# "Admin credentials not configured" in production.
# ─────────────────────────────────────────────────────────────────

# JWT signing secret + token lifetime (milliseconds).
# Must be ≥ 32 bytes when base64-decoded for HS256.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

# Admin allow-list. emails[i] pairs with passwords[i] by index.
# Add a second admin by setting ADMIN_EMAIL_2 + ADMIN_PASSWORD_2 on
# Render; leave them blank for a single-admin deploy.
admin:
  emails:
    - ${ADMIN_EMAIL:info@srikarthikeyacaterers.in}
    - ${ADMIN_EMAIL_2:srinivas.yanamandra04@gmail.com}
  passwords:
    - ${ADMIN_PASSWORD}
    - ${ADMIN_PASSWORD_2:}

# Public site URL — used in email links and review redirects.
frontend-url: ${FRONTEND_URL:https://srikarthikeyacaterers.in}

mail:
  from: ${MAIL_FROM:info@srikarthikeyacaterers.in}
  from-name: ${MAIL_FROM_NAME:Sri Karthikeya Caterers}
  retry:
    max-attempts: ${MAIL_RETRY_MAX_ATTEMPTS:2}
    backoff-ms: ${MAIL_RETRY_BACKOFF_MS:1000}

review:
  link:
    # Bare frontend origin only — buildReviewLink() appends "/feedback?t=…"
    # automatically. Any trailing slash or legacy /review|/feedback suffix
    # is defensively stripped at runtime, but configuring it cleanly here
    # avoids the double-segment bug we hit in production.
    base-url: ${REVIEW_LINK_BASE_URL:https://srikarthikeyacaterers.in}
    expiry-days: 90

campaign:
  throttle:
    per-minute: ${CAMPAIGN_THROTTLE_PER_MINUTE:120}
  default-batch-size: ${CAMPAIGN_DEFAULT_BATCH_SIZE:50}
  scheduler:
    poll-interval-ms: 30000

cors:
  allowed-origins:
    - ${FRONTEND_URL:https://srikarthikeyacaterers.in}
    - https://srikarthikeyacaterers.in
    - https://www.srikarthikeyacaterers.in
    - https://sri-karthikeya-caterers-frontend.vercel.app
    - http://localhost:3000
    - http://localhost:5173

# Disable debug endpoints in production
debug:
  endpoints:
    enabled: false
