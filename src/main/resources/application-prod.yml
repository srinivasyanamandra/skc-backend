spring:
  application:
    name: Sri Karthikeya Caterers API
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sri_karthikeya_caterers}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false
  
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 200
      thread-name-prefix: async-email-

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  forward-headers-strategy: framework
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    connection-timeout: 20000
    max-connections: 8192
    accept-count: 100

logging:
  level:
    root: INFO
    syncqubits.ai.skc: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: /app/logs/application.log
    max-size: 10MB
    max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  
  admin:
    email: ${ADMIN_EMAIL:admin@srikarthikeyacaterers.in}
    password: ${ADMIN_PASSWORD}
  
  frontend-url: ${FRONTEND_URL:https://srikarthikeyacaterers.in}

mail:
  from: ${MAIL_FROM:info@srikarthikeyacaterers.in}
  from-name: ${MAIL_FROM_NAME:Sri Karthikeya Caterers}
  retry:
    max-attempts: ${MAIL_RETRY_MAX_ATTEMPTS:2}
    backoff-ms: ${MAIL_RETRY_BACKOFF_MS:1000}

review:
  link:
    base-url: ${REVIEW_LINK_BASE_URL:https://srikarthikeyacaterers.in/review}
    expiry-days: 90

campaign:
  throttle:
    per-minute: ${CAMPAIGN_THROTTLE_PER_MINUTE:120}
  default-batch-size: ${CAMPAIGN_DEFAULT_BATCH_SIZE:50}
  scheduler:
    poll-interval-ms: 30000

cors:
  allowed-origins:
    - ${FRONTEND_URL:https://srikarthikeyacaterers.in}
    - https://srikarthikeyacaterers.in
    - https://www.srikarthikeyacaterers.in
    - https://sri-karthikeya-caterers-frontend.vercel.app
    - http://localhost:3000
    - http://localhost:5173

# Disable debug endpoints in production
debug:
  endpoints:
    enabled: false
