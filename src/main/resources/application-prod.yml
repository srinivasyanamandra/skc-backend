spring:
  application:
    name: sri-karthikeya-caterers-backend
  
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  
  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: ${MAIL_HOST:smtp.hostinger.com}
          starttls:
            enable: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 200
      thread-name-prefix: async-email-

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always

cors:
  allowed-origins:
    - ${FRONTEND_URL:https://srikarthikeyacaterers.in}

# Application-specific configuration
admin:
  emails:
    - info@srikarthikeyacaterers.in
    - srinivas.yanamandra04@gmail.com
  passwords:
    - ${ADMIN_PASSWORD}
    - ${ADMIN_PASSWORD_2}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds

review:
  link:
    default-expires-days: 14
    base-url: ${REVIEW_BASE_URL}

campaign:
  throttle:
    per-minute: 120
  default-batch-size: 50
  scheduler:
    poll-interval-ms: 30000   # how often the scheduler scans for queued campaigns

mail:
  from: ${MAIL_FROM:info@srikarthikeyacaterers.in}
  from-name: ${MAIL_FROM_NAME:Sri Karthikeya Caterers}
  retry:
    max-attempts: 2
    backoff-ms: 1000

logging:
  level:
    root: INFO
    syncqubits.ai.skc: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Disable debug endpoints in production
debug:
  endpoints:
    enabled: false
